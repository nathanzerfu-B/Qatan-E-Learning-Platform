<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="min-h-screen flex flex-col">
<header class="sticky top-0 bg-background-light dark:bg-background-dark/70 backdrop-blur-sm z-10">
<div class="container mx-auto px-4">
<div class="flex items-center justify-between py-4 border-b border-gray-200 dark:border-gray-800">
<button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
<svg class="text-gray-600 dark:text-gray-400" fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">

</svg>
</button>
<h1 class="text-lg font-bold text-gray-900 dark:text-white">Quiz Details</h1>
<div class="w-10"></div>
</div>
</div>
</header>
<main class="flex-grow container mx-auto px-4 py-6">
<div class="mb-8">
<h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">General Knowledge Quiz</h2>
<p class="text-gray-600 dark:text-gray-400">A quick test of your general knowledge.</p>
</div>
<div>
<h3 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Questions</h3>
<div class="space-y-6">
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<p class="font-medium text-gray-800 dark:text-gray-200 mb-4">1. What is the capital of France?</p>
<div class="grid grid-cols-2 gap-3">
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">London</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Berlin</button>
<button class="p-3 text-left text-sm rounded-lg bg-primary text-white ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-primary">Paris</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Rome</button>
</div>
</div>
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<p class="font-medium text-gray-800 dark:text-gray-200 mb-4">2. What is the highest mountain in the world?</p>
<div class="grid grid-cols-2 gap-3">
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">K2</button>
<button class="p-3 text-left text-sm rounded-lg bg-primary text-white ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-primary">Mount Everest</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Kangchenjunga</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Lhotse</button>
</div>
</div>
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<p class="font-medium text-gray-800 dark:text-gray-200 mb-4">3. How many continents are there?</p>
<div class="grid grid-cols-2 gap-3">
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">5</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">6</button>
<button class="p-3 text-left text-sm rounded-lg bg-primary text-white ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-primary">7</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">8</button>
</div>
</div>
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<p class="font-medium text-gray-800 dark:text-gray-200 mb-4">4. What is the speed of light?</p>
<div class="grid grid-cols-1 gap-3">
<button class="p-3 text-left text-sm rounded-lg bg-primary text-white ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-primary">299,792,458 m/s</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">299,792,458 km/s</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">299,792,458 mph</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">299,792,458 km/h</button>
</div>
</div>
<div class="bg-white dark:bg-gray-800/50 p-4 rounded-lg shadow-sm">
<p class="font-medium text-gray-800 dark:text-gray-200 mb-4">5. What is H2O?</p>
<div class="grid grid-cols-2 gap-3">
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Air</button>
<button class="p-3 text-left text-sm rounded-lg bg-primary text-white ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-primary">Water</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Fire</button>
<button class="p-3 text-left text-sm rounded-lg bg-gray-100 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300">Earth</button>
</div>
</div>
</div>
</div>

</div>
